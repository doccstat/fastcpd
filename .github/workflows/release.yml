name: Publish Python distributions

on:
  push:
    branches: [py]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Serialize push and release uploads.  PyPI versions are immutable, so two
  # runs for the same source version must not race to upload the same files.
  group: python-release-${{ github.repository }}-py
  cancel-in-progress: false

jobs:
  validate-release:
    name: Verify Python source/release
    if: >-
      github.repository == 'doccstat/fastcpd' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/py') ||
      (github.event_name == 'release' && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.classify.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Classify the source version
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/py; then
              echo "This release tag is not on the Python projection; skipping PyPI publication."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python python/_check_versions.py --root . --tag "$REF_NAME"
          else
            python python/_check_versions.py --root .
          fi

          version="$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "python")
          from _check_versions import read_python_version

          print(read_python_version(Path("python/__init__.py")))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A push may repeat a version that was already uploaded.  PyPI does
          # not allow replacing any file, so skip the build/upload in that case.
          existing="$(python - "$version" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/fastcpd/json", timeout=30
              ) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("false")
          else:
              print("true" if sys.argv[1] in payload.get("releases", {}) else "false")
          PY
          )"
          if [[ "$existing" == "true" ]]; then
            echo "fastcpd $version is already on PyPI; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "fastcpd $version is not on PyPI; publishing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build-sdist:
    name: Build source distribution
    needs: validate-release
    if: needs.validate-release.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: validate-release
    if: needs.validate-release.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/fastcpd
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Verify source, artifact, and tag versions
        run: |
          args=(--root . --artifacts dist --require-wheel --require-sdist)
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          python python/_check_versions.py "${args[@]}"

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
