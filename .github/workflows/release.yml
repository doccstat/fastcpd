name: Publish Python distributions

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Verify Python release tag
    if: >-
      github.repository == 'doccstat/fastcpd' &&
      github.event_name == 'release' &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.classify.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Classify the release tag
        id: classify
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/py; then
            echo "This release tag is not on the Python projection; skipping PyPI publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python python/_check_versions.py --root . --tag "$GITHUB_REF_NAME"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build-sdist:
    name: Build source distribution
    needs: validate-release
    if: needs.validate-release.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: validate-release
    if: needs.validate-release.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/fastcpd
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - name: Verify source, artifact, and tag versions
        run: >-
          python python/_check_versions.py
          --root .
          --artifacts dist
          --tag "$GITHUB_REF_NAME"
          --require-wheel
          --require-sdist

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
