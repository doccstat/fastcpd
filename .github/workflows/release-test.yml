name: Publish Python distributions to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Verify Python projection
    if: >-
      github.repository == 'doccstat/fastcpd' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/py'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Verify source version
        run: python python/_check_versions.py --root .

  build-sdist:
    name: Build source distribution
    needs: validate-source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-test-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build TestPyPI wheels on ${{ matrix.os }}
    needs: validate-source
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
          - os: windows-latest
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.0.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-test-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish distributions to TestPyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.pypi.org/p/fastcpd
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: python-test-*
          path: dist
          merge-multiple: true

      - name: Verify built distributions
        run: >-
          python python/_check_versions.py
          --root .
          --artifacts dist
          --require-wheel
          --require-sdist

      - name: Publish to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
